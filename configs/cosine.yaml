num_rounds: 10
num_clients: 100
batch_size: 20
num_classes: 10
aggregation_rounds: 1
alpha: 0.1 # control how much iid needed in the dataset, lower the more non-iid.
iid: 0 #bool value for data distribuitions

config_fit: # a config that each client will receive
  lr: 0.01 # learning rate to use by the clients
  momentum: 0.9 # momentum used by SGD optimiser on the client side
  epochs: 2 # number of training epochs each clients does in a fit() round

defaults:
  - model: net
  - neighbor_lists: random_weighted_05_50_5.yaml #Change file_name here


plot_colormap: nipy_spectral 
save_results: true
metric_path: "cosine_assignment/results"
figure_path: "cosine_assignment/figures"