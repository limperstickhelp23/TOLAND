algorithm: scalefree
plot_colormap: nipy_spectral   # turbo, jet, viridis nipy_spectral brg, gist_earth
save_results: True
metric_path: "results/baselines/scalefree/metrics"
figure_path: "results/baselines/scalefree/figures"


num_rounds: 2
num_clients: 10
batch_size: 20
num_classes: 10
aggregation_rounds: 1


alpha: 0.1 # control how much iid needed in the dataset, lower the more non-iid. #NOTE: edeg case occurs when alpha is too small
iid: 0 #bool value for data distribuitions

config_fit: # a config that each client will receive
  lr: 0.01 # learning rate to use by the clients
  momentum: 0.9 # momentum used by SGD optimiser on the client side
  epochs: 2 # number of training epochs each clients does in a fit() round


defaults:
  - model: net
  - neighbor_lists: random_weighted_05_50_5.yaml #Change file_name here

